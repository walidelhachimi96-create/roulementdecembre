<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بيضتي - متجر بيض طازج</title>
  //fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #f5a623;
      --primary-dark: #e08c00;
      --secondary: #2c3e50;
      --accent: #27ae60;
      --bg: #fffaf2;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --text-light: #7f8c8d;
      --shadow: 0 8px 32px rgba(245,166,35,0.13);
      --radius: 18px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); }

    /* NAVBAR */
    nav {
      position:sticky; top:0; z-index:100;
      background:rgba(255,255,255,0.97);
      backdrop-filter:blur(12px);
      border-bottom:2px solid #fde9b8;
      padding:0 5%;
      display:flex; align-items:center; justify-content:space-between;
      height:70px;
      box-shadow:0 2px 16px rgba(245,166,35,0.1);
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon { font-size:2rem; }
    .logo-text { font-weight:900; font-size:1.5rem; color:var(--primary-dark); }
    .logo-sub { font-size:0.7rem; color:var(--text-light); display:block; margin-top:-4px; }
    .nav-links { display:flex; gap:28px; list-style:none; }
    .nav-links a { text-decoration:none; color:var(--text); font-weight:600; font-size:0.95rem; transition:color 0.2s; }
    .nav-links a:hover { color:var(--primary); }
    .nav-cart {
      background:var(--primary); color:#fff; border:none; cursor:pointer;
      border-radius:50px; padding:10px 22px; font-family:'Cairo',sans-serif;
      font-weight:700; font-size:1rem; display:flex; align-items:center; gap:8px;
      transition:background 0.2s, transform 0.15s;
      position:relative;
    }
    .nav-cart:hover { background:var(--primary-dark); transform:scale(1.04); }
    .cart-badge {
      background:#e74c3c; color:#fff; border-radius:50%; width:22px; height:22px;
      display:flex; align-items:center; justify-content:center; font-size:0.78rem;
      font-weight:700; position:absolute; top:-8px; left:-6px;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #fff7e6 0%, #fde9b8 60%, #fff 100%);
      padding: 70px 5% 60px;
      display:flex; align-items:center; justify-content:space-between; gap:40px;
      flex-wrap:wrap;
    }
    .hero-text h1 { font-size:3rem; font-weight:900; line-height:1.2; color:var(--secondary); }
    .hero-text h1 span { color:var(--primary); }
    .hero-text p { font-size:1.15rem; color:var(--text-light); margin:18px 0 30px; max-width:420px; line-height:1.8; }
    .hero-btns { display:flex; gap:14px; flex-wrap:wrap; }
    .btn-primary {
      background:var(--primary); color:#fff; border:none; cursor:pointer;
      padding:14px 32px; border-radius:50px; font-family:'Cairo',sans-serif;
      font-weight:700; font-size:1.05rem; transition:all 0.2s;
      box-shadow:0 4px 16px rgba(245,166,35,0.35);
    }
    .btn-primary:hover { background:var(--primary-dark); transform:translateY(-2px); }
    .btn-outline {
      background:transparent; color:var(--primary); border:2px solid var(--primary);
      cursor:pointer; padding:12px 28px; border-radius:50px; font-family:'Cairo',sans-serif;
      font-weight:700; font-size:1.05rem; transition:all 0.2s;
    }
    .btn-outline:hover { background:var(--primary); color:#fff; }
    .hero-img-wrap {
      width:320px; height:280px; border-radius:24px; overflow:hidden;
      box-shadow:0 16px 48px rgba(245,166,35,0.25);
      animation:float 3s ease-in-out infinite;
      flex-shrink:0;
    }
    .hero-img-wrap img { width:100%; height:100%; object-fit:cover; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

    /* FEATURES STRIP */
    .features {
      display:flex; justify-content:center; gap:0;
      background:#fff; border-top:1px solid #fde9b8; border-bottom:1px solid #fde9b8;
      flex-wrap:wrap;
    }
    .feature-item {
      display:flex; align-items:center; gap:12px;
      padding:22px 40px; border-left:1px solid #fde9b8; flex:1; min-width:180px;
    }
    .feature-item:last-child { border-left:none; }
    .feature-icon { font-size:1.8rem; }
    .feature-text strong { display:block; font-weight:700; font-size:0.95rem; }
    .feature-text span { color:var(--text-light); font-size:0.82rem; }

    /* PRODUCTS */
    .section { padding:60px 5%; }
    .section-header { text-align:center; margin-bottom:40px; }
    .section-header h2 { font-size:2rem; font-weight:900; color:var(--secondary); }
    .section-header h2 span { color:var(--primary); }
    .section-header p { color:var(--text-light); margin-top:8px; font-size:1rem; }

    .products-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:28px;
    }
    .product-card {
      background:var(--card-bg); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden; transition:transform 0.2s,box-shadow 0.2s;
      border:1.5px solid #fde9b8; position:relative;
    }
    .product-card:hover { transform:translateY(-6px); box-shadow:0 16px 40px rgba(245,166,35,0.22); }
    .product-badge {
      position:absolute; top:14px; right:14px; z-index:2;
      background:var(--accent); color:#fff; border-radius:20px;
      padding:4px 12px; font-size:0.78rem; font-weight:700;
    }
    .product-badge.hot { background:#e74c3c; }
    .product-badge.new { background:#3498db; }
    .product-img-wrap {
      width:100%; height:200px; overflow:hidden; position:relative;
    }
    .product-img-wrap img {
      width:100%; height:100%; object-fit:cover;
      transition:transform 0.4s;
    }
    .product-card:hover .product-img-wrap img { transform:scale(1.07); }
    .product-info { padding:20px; }
    .product-name { font-weight:700; font-size:1.1rem; margin-bottom:6px; }
    .product-desc { color:var(--text-light); font-size:0.85rem; line-height:1.6; margin-bottom:14px; }
    .product-footer { display:flex; align-items:center; justify-content:space-between; }
    .product-price { font-weight:900; font-size:1.3rem; color:var(--primary-dark); }
    .product-price small { font-size:0.75rem; color:var(--text-light); font-weight:400; }
    .add-cart-btn {
      background:var(--primary); color:#fff; border:none; cursor:pointer;
      border-radius:50px; padding:10px 18px; font-family:'Cairo',sans-serif;
      font-weight:700; font-size:0.9rem; display:flex; align-items:center; gap:6px;
      transition:all 0.2s;
    }
    .add-cart-btn:hover { background:var(--primary-dark); transform:scale(1.05); }
    .add-cart-btn.added { background:var(--accent); }

    /* ORDER MODAL */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.55);
      z-index:300; opacity:0; pointer-events:none; transition:opacity 0.3s;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:#fff; border-radius:24px; width:100%; max-width:520px;
      max-height:90vh; overflow-y:auto;
      transform:scale(0.9) translateY(30px); transition:transform 0.3s;
      box-shadow:0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-overlay.open .modal { transform:scale(1) translateY(0); }
    .modal-header {
      padding:24px 24px 16px; border-bottom:2px solid #fde9b8;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; background:#fff; z-index:1;
    }
    .modal-header h3 { font-size:1.25rem; font-weight:900; }
    .modal-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-light); }
    .modal-close:hover { color:#e74c3c; }
    .modal-body { padding:24px; }
    .order-summary-box {
      background:#fff7e6; border-radius:14px; padding:16px; margin-bottom:20px;
      border:1.5px solid #fde9b8;
    }
    .order-summary-title { font-weight:700; margin-bottom:10px; font-size:0.95rem; }
    .order-summary-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:6px 0; border-bottom:1px dashed #fde9b8; font-size:0.9rem;
    }
    .order-summary-item:last-child { border-bottom:none; }
    .order-total-row {
      display:flex; justify-content:space-between; align-items:center;
      padding-top:10px; margin-top:4px; font-weight:900; font-size:1.05rem; color:var(--primary-dark);
    }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-weight:700; margin-bottom:7px; font-size:0.93rem; }
    .form-group label span { color:#e74c3c; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:13px 16px; border:2px solid #e8e8e8; border-radius:12px;
      font-family:'Cairo',sans-serif; font-size:0.95rem; outline:none;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--primary); box-shadow:0 0 0 3px rgba(245,166,35,0.12);
    }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .payment-options { display:flex; gap:12px; flex-wrap:wrap; }
    .payment-opt {
      flex:1; min-width:100px; border:2px solid #e8e8e8; border-radius:12px;
      padding:14px 12px; text-align:center; cursor:pointer; transition:all 0.2s;
    }
    .payment-opt:hover { border-color:var(--primary); }
    .payment-opt.selected { border-color:var(--primary); background:#fff7e6; }
    .payment-opt input { display:none; }
    .payment-opt .pay-icon { font-size:1.6rem; display:block; margin-bottom:5px; }
    .payment-opt .pay-label { font-size:0.82rem; font-weight:700; color:var(--text); }
    .submit-order-btn {
      width:100%; padding:17px; background:var(--primary); color:#fff; border:none;
      border-radius:50px; font-family:'Cairo',sans-serif; font-weight:700; font-size:1.1rem;
      cursor:pointer; transition:background 0.2s; margin-top:6px;
    }
    .submit-order-btn:hover { background:var(--primary-dark); }
    .submit-order-btn:disabled { background:#ccc; cursor:not-allowed; }

    /* SUCCESS SCREEN */
    .order-success {
      text-align:center; padding:40px 24px; display:none;
    }
    .order-success .success-icon { font-size:5rem; margin-bottom:16px; }
    .order-success h3 { font-size:1.6rem; font-weight:900; color:var(--accent); margin-bottom:10px; }
    .order-success p { color:var(--text-light); line-height:1.8; font-size:0.95rem; }
    .order-number { background:#e8f8ef; color:var(--accent); border-radius:12px; padding:12px 20px; margin:16px 0; font-weight:700; font-size:1.1rem; }
    .whatsapp-btn {
      display:inline-flex; align-items:center; gap:10px;
      background:#25d366; color:#fff; text-decoration:none;
      border-radius:50px; padding:14px 30px; font-weight:700; font-size:1rem;
      margin-top:14px; transition:background 0.2s;
    }
    .whatsapp-btn:hover { background:#1da851; }

    /* CART SIDEBAR */
    .cart-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.45);
      z-index:200; opacity:0; pointer-events:none; transition:opacity 0.3s;
    }
    .cart-overlay.open { opacity:1; pointer-events:all; }
    .cart-sidebar {
      position:fixed; top:0; left:0; height:100vh; width:380px; max-width:95vw;
      background:#fff; z-index:201; transform:translateX(-110%);
      transition:transform 0.35s cubic-bezier(.4,0,.2,1);
      display:flex; flex-direction:column;
      box-shadow:4px 0 32px rgba(0,0,0,0.15);
    }
    .cart-sidebar.open { transform:translateX(0); }
    .cart-header {
      padding:22px 22px 16px; border-bottom:2px solid #fde9b8;
      display:flex; align-items:center; justify-content:space-between;
    }
    .cart-header h3 { font-size:1.3rem; font-weight:900; }
    .cart-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-light); }
    .cart-close:hover { color:#e74c3c; }
    .cart-items { flex:1; overflow-y:auto; padding:16px 22px; }
